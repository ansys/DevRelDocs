name: Promote sandbox to main

on:
  schedule:
    # Update this cron expression to match your FCA promotion window.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List queued promotions without creating PRs
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote queued sandbox changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote queued pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/promote_to_main.sh
